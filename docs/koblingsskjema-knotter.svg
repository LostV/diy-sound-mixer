<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#111">Test 1: Pico 2 WH + knott 0, mute-knapp 0 og mute-LED 0</text>

  <!-- GND rail -->
  <line x1="300" y1="70" x2="300" y2="590" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
  <text x="300" y="610" text-anchor="middle" fill="#1d4ed8">blå skinne (−) = GND</text>
  <line x1="300" y1="128" x2="380" y2="128" stroke="#111" stroke-width="3"/>
  <circle cx="300" cy="128" r="5" fill="#111"/>

  <!-- Pico -->
  <rect x="380" y="56" width="140" height="504" rx="8" fill="#0f7b3e"/>
  <rect x="425" y="40" width="50" height="26" rx="4" fill="#9ca3af"/>
  <text x="450" y="58" text-anchor="middle" font-size="11" fill="#111">USB</text>
  <text x="450" y="300" text-anchor="middle" fill="#fff" font-size="15" font-weight="600" transform="rotate(-90 450 300)">Raspberry Pi Pico 2 WH (sett ovenfra)</text>
  <g fill="#fff" font-size="12">
    <circle cx="380" cy="80" r="5" fill="#fbbf24"/><text x="390" y="84">1 GP0</text>
    <circle cx="380" cy="104" r="5" fill="#fbbf24"/><text x="390" y="108">2 GP1</text>
    <circle cx="380" cy="128" r="5" fill="#111"/><text x="390" y="132">3 GND</text>
    <circle cx="380" cy="152" r="5" fill="#fbbf24"/><text x="390" y="156">4 GP2</text>
    <circle cx="380" cy="176" r="4" fill="#d1d5db"/><text x="390" y="180" opacity="0.7">5 GP3</text>
    <circle cx="380" cy="200" r="4" fill="#d1d5db"/><text x="390" y="204" opacity="0.7">6 GP4</text>
    <circle cx="380" cy="224" r="4" fill="#d1d5db"/><text x="390" y="228" opacity="0.7">7 GP5</text>
    <circle cx="380" cy="248" r="4" fill="#d1d5db"/><text x="390" y="252" opacity="0.7">8 GND</text>
    <circle cx="380" cy="272" r="4" fill="#d1d5db"/><text x="390" y="276" opacity="0.7">9 GP6</text>
    <circle cx="380" cy="296" r="4" fill="#d1d5db"/><text x="390" y="300" opacity="0.7">10 GP7</text>
    <circle cx="380" cy="320" r="4" fill="#d1d5db"/><text x="390" y="324" opacity="0.7">11 GP8</text>
    <circle cx="380" cy="344" r="4" fill="#d1d5db"/><text x="390" y="348" opacity="0.7">12 GP9</text>
    <circle cx="380" cy="368" r="4" fill="#d1d5db"/><text x="390" y="372" opacity="0.7">13 GND</text>
    <circle cx="380" cy="392" r="4" fill="#d1d5db"/><text x="390" y="396" opacity="0.7">14 GP10</text>
    <circle cx="380" cy="416" r="4" fill="#d1d5db"/><text x="390" y="420" opacity="0.7">15 GP11</text>
    <circle cx="380" cy="440" r="5" fill="#fbbf24"/><text x="390" y="444">16 GP12</text>
    <circle cx="380" cy="464" r="4" fill="#d1d5db"/><text x="390" y="468" opacity="0.7">17 GP13</text>
    <circle cx="380" cy="488" r="4" fill="#d1d5db"/><text x="390" y="492" opacity="0.7">18 GND</text>
    <circle cx="380" cy="512" r="4" fill="#d1d5db"/><text x="390" y="516" opacity="0.7">19 GP14</text>
    <circle cx="380" cy="536" r="4" fill="#d1d5db"/><text x="390" y="540" opacity="0.7">20 GP15</text>

    <circle cx="520" cy="488" r="5" fill="#111"/><text x="510" y="492" text-anchor="end">GND 23</text>
    <circle cx="520" cy="536" r="5" fill="#fbbf24"/><text x="510" y="540" text-anchor="end">GP16 21</text>
  </g>

  <!-- Encoder 0 -->
  <rect x="60" y="80" width="110" height="170" rx="6" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <circle cx="115" cy="165" r="30" fill="#9ca3af" stroke="#374151" stroke-width="2"/>
  <text x="115" y="70" text-anchor="middle" font-weight="600" fill="#111">Knott 0 (encoder)</text>
  <g font-size="12" fill="#111">
    <text x="164" y="104" text-anchor="end">A</text>
    <text x="164" y="134" text-anchor="end">C</text>
    <text x="164" y="164" text-anchor="end">B</text>
    <text x="164" y="209" text-anchor="end">SW</text>
    <text x="164" y="234" text-anchor="end">SW</text>
  </g>
  <text x="60" y="270" font-size="12" fill="#4b5563">3-pinnesiden: A, C (midten), B</text>
  <text x="60" y="286" font-size="12" fill="#4b5563">2-pinnesiden: trykknappen</text>

  <!-- encoder wires -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M170 100 H240 L260 80 H375" stroke="#eab308"/>
    <path d="M170 160 H240 L268 104 H375" stroke="#16a34a"/>
    <path d="M170 130 H296" stroke="#111"/>
    <path d="M170 205 H250 L280 152 H375" stroke="#2563eb"/>
    <path d="M170 230 H296" stroke="#111"/>
  </g>
  <g fill="#111"><circle cx="300" cy="130" r="4"/><circle cx="300" cy="230" r="4"/></g>
  <g font-size="11" fill="#374151">
    <text x="178" y="95">A → GP0</text>
    <text x="178" y="155">B → GP1</text>
    <text x="178" y="125">C → GND</text>
    <text x="178" y="200">SW → GP2</text>
    <text x="178" y="225">SW → GND</text>
  </g>

  <!-- Mute button 0 -->
  <rect x="120" y="415" width="50" height="50" rx="4" fill="#111"/>
  <circle cx="145" cy="440" r="14" fill="#374151"/>
  <text x="145" y="400" text-anchor="middle" font-weight="600" fill="#111">Mute-knapp 0</text>
  <text x="60" y="490" font-size="12" fill="#4b5563">Bruk to pinner på skrå (diagonalt)</text>
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M170 420 H250 L270 440 H375" stroke="#2563eb"/>
    <path d="M170 460 H296" stroke="#111"/>
  </g>
  <circle cx="300" cy="460" r="4" fill="#111"/>
  <text x="200" y="415" font-size="11" fill="#374151">→ GP12</text>
  <text x="200" y="476" font-size="11" fill="#374151">→ GND</text>

  <!-- Mute LED 0 -->
  <text x="720" y="400" text-anchor="middle" font-weight="600" fill="#111">Mute-LED 0 (rød LED-knapp)</text>
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M525 536 H620" stroke="#dc2626"/>
    <path d="M680 536 H740 V500" stroke="#dc2626"/>
    <path d="M740 460 V440 H800 V488 H525" stroke="#111"/>
  </g>
  <rect x="620" y="526" width="60" height="20" rx="6" fill="#d6b48a" stroke="#78350f"/>
  <rect x="634" y="526" width="4" height="20" fill="#dc2626"/><rect x="644" y="526" width="4" height="20" fill="#dc2626"/><rect x="654" y="526" width="4" height="20" fill="#78350f"/>
  <text x="650" y="566" text-anchor="middle" font-size="12" fill="#111">220 Ω</text>
  <polygon points="725,500 755,500 740,470" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
  <line x1="725" y1="468" x2="755" y2="468" stroke="#7f1d1d" stroke-width="3"/>
  <text x="762" y="500" font-size="12" fill="#111">+ (anode)</text>
  <text x="762" y="470" font-size="12" fill="#111">− (katode)</text>
  <text x="540" y="600" font-size="12" fill="#4b5563">Motstanden kan stå på hvilken side av LED-en som helst.</text>
  <text x="540" y="616" font-size="12" fill="#4b5563">Lyser den ikke: snu LED-en (+ og −).</text>
</svg>
