<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Segoe UI, Arial, sans-serif" font-size="12">
<rect width="720" height="420" fill="#ffffff"/>
<text x="360" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#111">Encoder – mål (1 mm = 10 px)</text>

<!-- side view -->
<text x="200" y="56" text-anchor="middle" font-weight="600" fill="#111">Fra siden</text>
<line x1="80" y1="330" x2="320" y2="330" stroke="#d1d5db"/>
<!-- body 13.5 wide, 6.5 high -->
<rect x="136.5" y="265" width="127" height="65" fill="#9ca3af" stroke="#4b5563"/>
<rect x="136.5" y="265" width="127" height="6" fill="#d1d5db" stroke="#4b5563"/>
<!-- bushing 6.84 wide, 4.7 high -->
<rect x="165.8" y="218" width="68.4" height="47" fill="#d1d5db" stroke="#4b5563"/>
<g stroke="#6b7280"><line x1="165.8" y1="228" x2="234.2" y2="233"/><line x1="165.8" y1="238" x2="234.2" y2="243"/><line x1="165.8" y1="248" x2="234.2" y2="253"/></g>
<!-- shaft (unknown length) -->
<rect x="175" y="209.5" width="50" height="8.5" fill="#d1d5db" stroke="#4b5563"/>
<rect x="170" y="116.5" width="60" height="93" fill="#e5e7eb" stroke="#4b5563"/>
<line x1="212" y1="116.5" x2="212" y2="200" stroke="#4b5563" stroke-dasharray="3 2"/>
<text x="191" y="168" text-anchor="middle" fill="#dc2626" font-weight="600">E7 9,3</text>
<text x="240" y="216" fill="#dc2626" font-size="11" font-weight="600">E6 0,85</text>
<line x1="80" y1="115" x2="170" y2="115" stroke="#d1d5db"/>
<line x1="86" y1="115" x2="86" y2="265" stroke="#7c3aed"/><line x1="80" y1="115" x2="92" y2="115" stroke="#7c3aed"/><line x1="80" y1="265" x2="92" y2="265" stroke="#7c3aed"/>
<text x="78" y="190" text-anchor="middle" fill="#7c3aed" font-weight="600" transform="rotate(-90 78 190)">E8 15</text>
<!-- legs -->
<g stroke="#6b7280" stroke-width="3"><line x1="160" y1="330" x2="160" y2="365"/><line x1="200" y1="330" x2="200" y2="365"/><line x1="240" y1="330" x2="240" y2="365"/></g>
<!-- E1 bushing dia -->
<text x="160" y="246" text-anchor="end" fill="#2563eb" font-weight="600">E1 Ø6,84</text>
<!-- E2 bushing height -->
<line x1="290" y1="218" x2="290" y2="265" stroke="#2563eb"/><line x1="284" y1="218" x2="296" y2="218" stroke="#2563eb"/><line x1="284" y1="265" x2="296" y2="265" stroke="#2563eb"/>
<line x1="234" y1="218" x2="290" y2="218" stroke="#d1d5db"/>
<text x="300" y="245" fill="#2563eb" font-weight="600">E2 4,7</text>
<!-- E4 body height -->
<line x1="310" y1="265" x2="310" y2="330" stroke="#16a34a"/><line x1="304" y1="265" x2="316" y2="265" stroke="#16a34a"/><line x1="304" y1="330" x2="316" y2="330" stroke="#16a34a"/>
<text x="320" y="302" fill="#16a34a" font-weight="600">E3 høyde 6,5</text>
<!-- E3 width -->
<line x1="136.5" y1="385" x2="263.5" y2="385" stroke="#16a34a"/><line x1="136.5" y1="379" x2="136.5" y2="391" stroke="#16a34a"/><line x1="263.5" y1="379" x2="263.5" y2="391" stroke="#16a34a"/>
<text x="200" y="403" text-anchor="middle" fill="#16a34a" font-weight="600">E3 12,7 langs siden med 3 bein</text>

<!-- top view -->
<text x="540" y="56" text-anchor="middle" font-weight="600" fill="#111">Ovenfra</text>
<rect x="476.5" y="112.5" width="127" height="135" fill="#9ca3af" stroke="#4b5563"/>
<circle cx="540" cy="180" r="34.2" fill="#d1d5db" stroke="#4b5563"/>
<path d="M558 154.1 A30 30 0 1 0 558 205.9 Z" fill="#e5e7eb" stroke="#4b5563"/>
<text x="534" y="184" text-anchor="middle" fill="#dc2626" font-weight="600">D</text>
<!-- legs -->
<g fill="#6b7280"><rect x="497" y="247.5" width="6" height="10"/><rect x="537" y="247.5" width="6" height="10"/><rect x="577" y="247.5" width="6" height="10"/>
<rect x="507" y="102.5" width="6" height="10"/><rect x="567" y="102.5" width="6" height="10"/></g>
<text x="540" y="270" text-anchor="middle" fill="#6b7280" font-size="11">3 bein (A, C, B)</text>
<text x="540" y="98" text-anchor="middle" fill="#6b7280" font-size="11">2 bein (trykknapp)</text>
<line x1="476.5" y1="290" x2="603.5" y2="290" stroke="#16a34a"/><line x1="476.5" y1="284" x2="476.5" y2="296" stroke="#16a34a"/><line x1="603.5" y1="284" x2="603.5" y2="296" stroke="#16a34a"/>
<text x="540" y="308" text-anchor="middle" fill="#16a34a" font-weight="600">12,7</text>
<line x1="625" y1="112.5" x2="625" y2="247.5" stroke="#16a34a"/><line x1="619" y1="112.5" x2="631" y2="112.5" stroke="#16a34a"/><line x1="619" y1="247.5" x2="631" y2="247.5" stroke="#16a34a"/>
<text x="635" y="184" fill="#16a34a" font-weight="600">13,5</text>

<text x="540" y="345" text-anchor="middle" fill="#111" font-size="11">Ingen låsetapp (S6): lommen bak platen holder kroppen</text>
<text x="540" y="362" text-anchor="middle" fill="#111" font-size="11">Akselen er D-formet (den flate siden til høyre)</text>
<text x="540" y="395" text-anchor="middle" fill="#6b7280" font-size="11">Alle mål i mm. E = målt av deg, S = spørsmål.</text>
</svg>
