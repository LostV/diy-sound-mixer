[workspace]
resolver = "3"
members = ["crates/mixer-core", "crates/mixer-wasapi", "crates/mixer-devices", "app/src-tauri"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
mixer-core = { path = "crates/mixer-core" }
mixer-wasapi = { path = "crates/mixer-wasapi" }
mixer-devices = { path = "crates/mixer-devices" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
