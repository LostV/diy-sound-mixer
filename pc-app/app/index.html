<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIY Sound Mixer</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body class="mixer">
    <div class="aurora" aria-hidden="true">
      <span class="blob purple"></span>
      <span class="blob pink"></span>
      <span class="blob teal"></span>
      <span class="blob orange"></span>
    </div>

    <header class="titlebar" data-tauri-drag-region>
      <span class="app-mark" aria-hidden="true"></span>
      <h1 data-tauri-drag-region>DIY Sound Mixer</h1>
      <div class="header-controls">
        <button
          id="open-settings"
          class="icon-btn"
          type="button"
          aria-haspopup="dialog"
          aria-expanded="false"
          aria-controls="settings-panel"
          data-i18n-label="settings"
          data-i18n-title="settings"
          aria-label="Settings"
          title="Settings"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12" />
            <circle cx="16" cy="6" r="2" />
            <circle cx="10" cy="12" r="2" />
            <circle cx="18" cy="18" r="2" />
          </svg>
        </button>
        <div class="window-buttons">
          <button id="win-min" class="win-btn" type="button" data-i18n-label="minimize" aria-label="Minimize">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5h8" /></svg>
          </button>
          <button id="win-close" class="win-btn close" type="button" data-i18n-label="closeToTray" aria-label="Close to the system tray">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" /></svg>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section id="channels" class="channels" data-i18n-label="channels" aria-label="Channels"></section>

      <section class="card lane" aria-labelledby="uncontrolled-title">
        <h2 id="uncontrolled-title" data-i18n="uncontrolled">Not controlled</h2>
        <div id="uncontrolled" class="dropzone chips" data-target="none"></div>
        <p class="hint" data-i18n="uncontrolledHint">Drag an app here to leave it alone · click an app for more options</p>
      </section>

      <details class="card details">
        <summary data-i18n="details">Details</summary>
        <table>
          <thead>
            <tr>
              <th data-i18n="colApp">App</th>
              <th data-i18n="colProcess">Process</th>
              <th data-i18n="colPlaysOn">Plays on</th>
              <th data-i18n="colPlaced">Placed</th>
            </tr>
          </thead>
          <tbody id="session-rows"></tbody>
        </table>
      </details>
    </main>

    <div id="settings-panel" class="popover settings-panel" role="dialog" data-i18n-label="settings" aria-label="Settings" hidden>
      <label class="setting switch">
        <span data-i18n="autostart">Start with Windows</span>
        <input id="autostart" type="checkbox" role="switch" />
        <span class="track" aria-hidden="true"><span class="knob"></span></span>
      </label>
      <label class="setting">
        <span data-i18n="language">Language</span>
        <select id="language">
          <option value="en" lang="en">English</option>
          <option value="no" lang="nb">Norsk</option>
        </select>
      </label>
      <label class="setting">
        <span data-i18n="backdropTitle">Window background</span>
        <select id="backdrop">
          <option value="acrylic">Acrylic</option>
          <option value="mica">Mica</option>
          <option value="none">Aurora</option>
        </select>
      </label>
      <button id="open-simulator" class="setting-button" type="button">Simulator</button>
    </div>

    <div id="chip-menu" class="popover chip-menu" role="menu" hidden></div>
  </body>
</html>
