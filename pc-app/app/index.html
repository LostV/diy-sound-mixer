<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIY Sound Mixer</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header>
      <h1>DIY Sound Mixer</h1>
      <div class="header-controls">
        <label class="mic-picker">
          Mikrofon
          <select id="mic-select"></select>
        </label>
        <label class="toggle">
          <input id="autostart" type="checkbox" />
          Start med Windows
        </label>
        <button id="open-simulator" type="button">Simulator</button>
      </div>
    </header>

    <section id="channels" class="channels" aria-label="Kanaler"></section>

    <section class="sessions">
      <h2>Apper med lyd</h2>
      <table>
        <thead>
          <tr>
            <th>App</th>
            <th>Prosess</th>
            <th>Enhet</th>
            <th>Nå i</th>
            <th>Regel</th>
          </tr>
        </thead>
        <tbody id="session-rows"></tbody>
      </table>
      <p class="hint">
        «Standard» betyr at mappe-regler og standardkanalen bestemmer. Valget lagres per program.
      </p>
    </section>
  </body>
</html>
