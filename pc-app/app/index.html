<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIY Sound Mixer</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header>
      <h1>DIY Sound Mixer</h1>
      <div class="header-controls">
        <label class="toggle">
          <input id="autostart" type="checkbox" />
          Start med Windows
        </label>
        <button id="open-simulator" type="button">Simulator</button>
      </div>
    </header>

    <section id="channels" class="channels" aria-label="Kanaler"></section>

    <section class="lane" aria-labelledby="uncontrolled-title">
      <div class="lane-head">
        <h2 id="uncontrolled-title">Ikke styrt</h2>
        <p class="hint">
          Dra en app til en kanal, eller hit for å la den være i fred. Klikk på en app for flere valg.
        </p>
      </div>
      <div id="uncontrolled" class="dropzone chips" data-target="none"></div>
    </section>

    <details class="details">
      <summary>Detaljer</summary>
      <table>
        <thead>
          <tr>
            <th>App</th>
            <th>Prosess</th>
            <th>Spiller på</th>
            <th>Plassert</th>
          </tr>
        </thead>
        <tbody id="session-rows"></tbody>
      </table>
    </details>

    <div id="chip-menu" class="chip-menu" role="menu" hidden></div>
  </body>
</html>
