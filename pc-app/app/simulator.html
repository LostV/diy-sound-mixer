<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulator – DIY Sound Mixer</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/simulator.css" />
    <script type="module" src="/src/simulator.ts" defer></script>
  </head>

  <body class="sim">
    <div class="device" data-i18n-label="simDevice" aria-label="Simulated mixer">
      <div class="bezel">
        <div id="screen" class="screen" data-i18n-label="simScreen" aria-label="Screen 800×480"></div>
      </div>
      <div id="controls" class="controls"></div>
    </div>

    <section class="log-panel">
      <header>
        <h2 data-i18n="protocol">Protocol</h2>
        <label><input id="log-meter" type="checkbox" /> <span data-i18n="showMeter">Show meter</span></label>
        <button id="log-clear" type="button" data-i18n="clear">Clear</button>
      </header>
      <ol id="log" class="log" aria-live="off"></ol>
      <p class="hint" data-i18n="simHint">
        Turn: mouse wheel or drag up/down. Click the knob or the screen to mute. Arrow keys work when a knob has focus.
        Everything goes through the same protocol as the real hardware.
      </p>
    </section>
  </body>
</html>
